<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Stylish Weather App</title>
    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playwrite+AU+SA:wght@100..400&display=swap"
    />

    <!-- Axios -->
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="src/styles.css" />
  </head>

  <body>
    <div class="container">
      <!-- Search section -->
      <header>
        <form id="search-form">
          <input
            type="search"
            name="add-city"
            id="add-city"
            placeholder="Enter city name"
            required
          />

          <button type="submit">Search</button>
        </form>

        <hr />
      </header>

      <!-- Current weather section -->
      <main>
        <div class="current-weather">
          <h1 id="city">Type a place..</h1>

          <p class="current-date">
            <strong> <span class="today"></span> </strong>,
            <span class="condition-description"></span>
            <br />
            Humidity:
            <strong> <span class="humidity">%</span> </strong>, Wind:
            <strong>
              <span class="wind">m/s</span>
            </strong>
          </p>

          <p class="temperature-now">
            <span class="material-symbols-outlined main">sunny</span>
            <span class="current-temperature">°C</span>
          </p>
        </div>

        <!-- Forecast section -->
        <div id="forecast"></div>
      </main>

      <hr />

      <!-- Project information -->
      <footer>
        <p class="coded-by">
          This project was coded by
          <a
            class="foot-link"
            href="https://github.com/Pampinup"
            target="_blank"
            rel="noopener noreferrer"
          >
            Joice Ortega
          </a>
          and is on
          <a
            class="foot-link"
            href="https://github.com/Pampinup/Weather-App-Project"
            target="_blank"
            rel="noopener noreferrer"
          >
            GitHub
          </a>
          and hosted on
          <a
            class="foot-link"
            href="https://dapper-gumdrop-ea35d0.netlify.app/"
            target="_blank"
            rel="noopener noreferrer"
          >
            Netlify
          </a>
        </p>
      </footer>
    </div>

    <!-- Portfolio logo -->
    <div class="menu">
      <a
        href="https://desing-main-portfolio.netlify.app/"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img
          class="logo"
          src="src/images/J-O-logo.png"
          alt="Joice Ortega portfolio"
        />
      </a>
    </div>

    <!-- JavaScript -->
    <script src="src/script.js"></script>
  </body>
</html>
